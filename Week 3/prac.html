<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>practice</title>
</head>
<body>
<h4>Registration form!</h4>
    <form action="https://formspree.io/f/xeokawkk" method="POST">

        <p>please enter your credentials:</p>
        <input type="text" placeholder="User name">
        <br><br>
        <input type="password" placeholder="Password">

        <br><br>
        <p>please select your city:</p>
        <select name="city">
            
            <option value="kandukur">kandukur</option>
            <option value="ongole">ongole</option>
            <option value="hyderabad">hyderabad</option>
        </select>
        <br><br>
        please select your class:
        <label for="1">
            <input type="radio" value="class 1" name="class" id="1">class 1
        </label>
        <label for="2">
            <input type="radio" value="class 2" name="class" id="2">class 2
        </label>
        <label for="3">
            <input type="radio" value="class 3" name="class" id="3">class 3
        </label>
        <br><br>
        <p>please select your interested subs:</p>
        <label for="math">
            <input type="checkbox" value="math" name="subject" id="math">mathematics
        </label>
        <label for="phy">
            <input type="checkbox" value="phy" name="subject" id="phy">physics
        </label>
        <label for="chem">
            <input type="checkbox" value="chem" name="subject" id="chem">chemistry
        </label>
<br><br>
<p>Your suggestions and feedback:</p>
        <textarea name="feedback" id="101" placeholder="Type you valuable feedback!" rows="5" columns="2"></textarea>
<br>
<input type="submit" value="click here to submit">
    </form>



</body>
</html>
